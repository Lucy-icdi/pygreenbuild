[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygreenbuild"
version = "0.1.0"
description = "ICDI GreenBIM Python Tool"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [
    { name = "Lucy Lee", email = "lucy@icdi.asia" },
    { name = "ICDI Team", email = "greenbim@icdi.asia" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.1.4",
    "numpy>=1.26.4",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "psychrolib>=2.5.0",
    "sqlalchemy>=2.0.0,<3.0",
    "typer>=0.12.0",
    "typing-extensions>=4.9.0",
    "pymysql>=1.2.0",
]

keywords = [
    "bim",
    "energy",
    "crawler",
    "green-building",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.6.0,<2",  # FastMCP；2.x 已更名為 MCPServer
    "pydantic>=2.0.0",
]

[project.scripts]
pygreenbuild-mcp = "pygreenbuild.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipython>=8.20.0",
    "ipykernel>=6.31.0",
    "spyder-kernels>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/Lucy-icdi/pygreenbuild"
Repository = "https://github.com/Lucy-icdi/pygreenbuild"
Issues = "https://github.com/Lucy-icdi/pygreenbuild"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
